<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Mai 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts"></div>

  <main class="card">
    <h1>Hey Mai 💕</h1>
    <p class="subtitle">From Bezalel, with love</p>

    <p class="message">
      I really love being with you.<br />
      I have so much fun with you.<br />
      And your smile is my favorite thing in the world ✨
    </p>

    <div class="buttons">
      <button id="factBtn">Show a Love Fact 💌</button>
      <button id="musicBtn">Play Music 🔊</button>
    </div>

    <p id="factText" class="fact"></p>

    <section class="letterBox">
      <h2>My Letter to You 💌</h2>
      <p id="typedLetter" class="typed"></p>
    </section>

    <p id="countdown" class="countdown"></p>

    <p class="footer">Made by Bezalel for Mai 🌸</p>
  </main>

  <!-- MUSIC (MP4) -->
  <!-- Put your file in the SAME folder as this index.html and name it: music.mp4 -->
  <audio id="bgMusic" preload="auto">
    <source src="music.mp4" type="audio/mp4" />
    Your browser does not support audio.
  </audio>

  <script src="script.js"></script>
</body>
</html>
