<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Mai 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts"></div>

  <main class="card">
    <h1>Hey Mai 💕</h1>
    <p class="subtitle">From Bezalel, with love</p>

    <p class="message">
      I really love being with you.<br />
      I have so much fun with you.<br />
      And your smile is my favorite thing in the world ✨
    </p>

    <div class="buttons">
      <button id="factBtn">Show a Love Fact 💌</button>
      <button id="musicBtn">Play Video ▶️</button>
    </div>

    <p id="factText" class="fact"></p>

    <section class="letterBox">
      <h2>My Letter to You 💌</h2>
      <p id="typedLetter" class="typed"></p>
    </section>

    <p id="countdown" class="countdown"></p>

    <!-- VIDEO -->
    <!-- Put your file in repo root and name it exactly: music.mp4 -->
    <video id="bgMusic" controls playsinline preload="auto" class="loveVideo">
      <source src="music.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <p class="footer">Made by Bezalel for Mai 🌸</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
